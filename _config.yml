name: Davide Beltrame
url: "https://davidebeltrame.com"
baseurl: ""

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  # Build checks, run by CI and by hand. Not part of the site.
  - script
  # Local working files. Also gitignored — excluded here so a local
  # `jekyll serve` never puts them on a served path either.
  # Jekyll matches these with fnmatch and `*` crosses `/`, so the
  # deliberately published PDF under assets/ is restored via `include`.
  - "*.pdf"
  - _design
  - dadochat

# Wins over `exclude`: the two PDFs this site serves. Listed by file name,
# because Jekyll 3.9, which GitHub Pages runs, matches `include` against the
# name of the file in the directory being read, so a path never matches.
include:
  - davide_beltrame_cv.pdf
  - length-aware-diffusion-poster.pdf
