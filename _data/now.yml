paragraphs:
  - en: "On October 23rd I graduated from Bocconi University with an MSc in Computer Science for AI, 110/110 cum laude. My thesis is titled “Bias and Memory in Diffusion Models: Training-Data Dependence and Image Reconstruction through Learned Conditioning”."
    it: "Il 23 ottobre mi sono laureato in Computer Science for AI all’Università Bocconi con 110 e lode. La tesi si intitola “Bias and Memory in Diffusion Models: Training-Data Dependence and Image Reconstruction through Learned Conditioning”."
  - en: "I also worked as a technical consultant at <a href=\"https://www.silverstream.ai/\">Silverstream AI</a>, doing AI agent evaluation."
    it: "Ho anche lavorato come consulente tecnico presso <a href=\"https://www.silverstream.ai/\">Silverstream AI</a>, occupandomi di valutazione di agenti di IA."
