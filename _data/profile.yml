# Identity, bio, and contact links.
#
# Bilingual values are an {en, it} pair, resolved by _includes/t.html.
#
# `contact.email_encoded` is the address with every character replaced by its
# numeric HTML entity. It is stored that way, not converted at build time, so
# the address appears as plain text in no file of this repository — which is
# public — and in no page it serves. The browser decodes it while parsing the
# attribute, so the link behaves normally. To change it:
#
#   python3 -c "print(''.join('&#%d;' % ord(c) for c in 'you@example.com'))"
#
# It is also left out of /api/content.json; publishing it there as JSON would
# undo the point of encoding it here.

name: Davide Beltrame

title:
  en: "Student & researcher in deep learning and AI"
  it: "Studente e ricercatore in IA e deep learning"

greeting:
  en: "Hi, I'm Davide!"
  it: "Ciao, sono Davide!"

about:
  en: "I'm a student in the <a href=\"https://www.unibocconi.it/en/programs/master-science/artificial-intelligence\" target=\"_blank\" rel=\"noopener noreferrer\">MSc in Artificial Intelligence at Bocconi University</a>, where I advise machine-learning projects with <a href=\"https://bsmachinelearning.com\" target=\"_blank\" rel=\"noopener noreferrer\">Bocconi Students for Machine Learning</a>. I write for <a href=\"https://www.consensusrivista.com\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Rivista</a> as Editor-in-Chief delegate to AI and New Technologies. <br><br><strong>I'm working on my master's thesis on generalization in diffusion models at the Bocconi Machine Learning &amp; Statistical Physics Lab, advised by Luca Biggio. A paper I co-authored with the Statistical Physics Lab, on biased generalization in diffusion models, was accepted at ICML 2026 as a spotlight (top 2.2% of submissions).</strong>"
  it: "Sono uno studente della <a href=\"https://www.unibocconi.it/it/corsi-di-studio/master-of-science/artificial-intelligence\" target=\"_blank\" rel=\"noopener noreferrer\">magistrale in Intelligenza Artificiale presso l'Università Bocconi</a>, dove faccio da advisor per progetti di machine learning con <a href=\"https://bsmachinelearning.com\" target=\"_blank\" rel=\"noopener noreferrer\">Bocconi Students for Machine Learning</a>. Scrivo per <a href=\"https://www.consensusrivista.com\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Rivista</a> come Caporedattore delegato all'AI e alle Nuove Tecnologie. <br><br><strong>Sto lavorando alla tesi magistrale sulla generalizzazione nei modelli di diffusione presso il Bocconi Machine Learning &amp; Statistical Physics Lab, relatore Luca Biggio. Un articolo scritto con lo Statistical Physics Lab, sulla generalizzazione distorta nei modelli di diffusione, è stato accettato a ICML 2026 come spotlight (primo 2.2% delle submission).</strong>"

# The portrait ships at three widths in webp and jpg. `src` is the fallback and
# keeps the URL the photo has always had. `displayed` is the CSS box it is drawn
# in — it feeds the `sizes` attribute, so if the design changes that box, this is
# the one value to change with it.
#
# Strip EXIF from anything regenerated here. A file straight off a phone carries
# GPS coordinates, a device model and a timestamp.
portrait:
  src: "/assets/files/davide_beltrame_propic.jpg"
  variants: "/assets/img/portrait"
  widths: [320, 640, 960]
  displayed: "150px"
  box: 150
  alt:
    en: "Davide Beltrame"
    it: "Davide Beltrame"

