# Identity, bio, and contact links.
#
# Bilingual values are an {en, it} pair, resolved by _includes/t.html.
#
# `contact.email_encoded` is the address with every character replaced by its
# numeric HTML entity. It is stored that way, not converted at build time, so
# the address appears as plain text in no file of this repository — which is
# public — and in no page it serves. The browser decodes it while parsing the
# attribute, so the link behaves normally. To change it:
#
#   python3 -c "print(''.join('&#%d;' % ord(c) for c in 'you@example.com'))"

name: Davide Beltrame

# The line under his name on the Open Graph cards (assets/img/og-card*.jpg). No
# page renders it.
title:
  en: "MSc in Artificial Intelligence (Computer Science), Bocconi · Research on diffusion models"
  it: "Laurea magistrale in Artificial Intelligence (Informatica), Bocconi · Ricerca sui diffusion models"

# The universities he graduated from, newest first, for the home page's
# structured data.
alumni_of:
  - name: "Bocconi University"
    url: "https://www.unibocconi.it"
  - name: "LUISS Guido Carli University"
    url: "https://www.luiss.it"

# The portrait ships at three widths in webp and jpg. `src` is the fallback and
# keeps the URL the photo has always had. `displayed` is the CSS box it is drawn
# in — it feeds the `sizes` attribute, so if the design changes that box, this is
# the one value to change with it. The file is square, so nothing is cropped at
# render time; `box` feeds width/height and reserves the space before the image
# arrives.
#
# Regenerate every variant, and both Open Graph cards, from one source: the
# cards embed the photograph, so a new portrait that skips them leaves the old
# face in every link preview.
#
# Strip EXIF from anything regenerated here. The photo replaced on 2026-08-13
# arrived carrying an iPhone model, an iOS version, a capture timestamp, an XMP
# block and a second embedded image; the one before it carried GPS coordinates.
portrait:
  src: "/assets/files/davide_beltrame_propic.jpg"
  variants: "/assets/img/portrait"
  widths: [320, 640, 960]
  displayed: "(max-width: 640px) 144px, 240px"
  box: 240
  alt:
    en: "Davide Beltrame"
    it: "Davide Beltrame"

contact:
  email_encoded: "&#100;&#97;&#118;&#105;&#100;&#101;&#98;&#101;&#108;&#116;&#114;&#97;&#109;&#101;&#50;&#48;&#48;&#50;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;"
  github: "https://github.com/davide-beltrame"
  linkedin: "https://www.linkedin.com/in/davide-beltrame"
  # Listed in the structured data as one of his profiles. Not a contact link on
  # the page — adding one is a design decision, not a metadata one. The `hl`
  # parameter of the URL he uses is an interface-language preference, not part of
  # the identifier, so it is left off.
  scholar: "https://scholar.google.com/citations?user=7hTm8DEAAAAJ"
  cv: "/assets/files/davide_beltrame_cv.pdf"

