# Projects. Only entries with `featured: true` render on /projects/.
# Titles are repository and project names and stay untranslated.
#
# `status`, where present, carries a checkable grade or outcome verbatim —
# the same field name and pattern as `_data/research.yml`'s papers.
#
# `date` is `YYYY-MM` and exists so /everything/ can order papers and projects
# in one list. It is not displayed anywhere else. Each one is sourced, not
# estimated, and the source is named on the entry: an event date he confirmed,
# a date already published on the site, or the repository's creation date from
# the public GitHub API. Correct any of them at will — nothing else reads this
# field, and the index re-sorts itself.

items:
  - title: "SO-101 Policy Training"
    # EuroTech x HKTE Hackathon, June 2026 — the event date, confirmed by him.
    date: "2026-06"
    description:
      en: "Built at the EuroTech x HKTE Hackathon: trained ACT and SmolVLA imitation-learning policies on a SO-101 robotic arm."
      it: "Realizzato durante l’EuroTech x HKTE Hackathon: addestramento di policy di imitation learning ACT e SmolVLA su un braccio robotico SO-101."
    tech:
      - "Robotics"
      - "Imitation learning"
    url: "https://github.com/giacomo-ciro/eurotech-hackathon"
    featured: true
    collaborative: true

  - title: "More Efficient Text Diffusion via Length Prediction"
    # 20879 Language Technology, examined 19 May 2025 — the date already on
    # /story/ for that course.
    date: "2025-05"
    description:
      en: "A course project on predicting response length before text diffusion begins, reducing the context used for generation. This work developed into the length-aware diffusion paper."
      it: "Un progetto di corso sulla previsione della lunghezza delle risposte prima della generazione per diffusione, per ridurre il contesto utilizzato. Il lavoro è proseguito nell’articolo sui modelli di diffusione consapevoli della lunghezza."
    status:
      en: "Graded as the best exam project for the Bocconi graduate course 20879 Language Technology."
      it: "Valutato come miglior progetto d’esame per il corso magistrale Bocconi 20879 Language Technology."
    tech:
      - "NLP"
      - "Deep learning"
    url: "https://github.com/giacomo-ciro/diffusion-llms"
    featured: true
    collaborative: true

  - title: "Do AI and Human Experts See Pneumonia the Same Way?"
    # Published by Bocconi Students for Machine Learning on 16 June 2025, the
    # date in the URL of the write-up linked from /research/.
    date: "2025-06"
    description:
      en: "Co-first-authored a comparison of CNN saliency maps with 300+ annotations from 14 medical students and doctors on pediatric chest X-rays."
      it: "Co-primo autore di un confronto tra mappe di salienza di CNN e oltre 300 annotazioni di 14 studenti di medicina e medici su radiografie toraciche pediatriche."
    status:
      en: "Graded as the best (tied) exam project for the Bocconi graduate course 20878 Computer Vision & Image Processing. Published by Bocconi Students for Machine Learning."
      it: "Valutato come miglior progetto d’esame (ex aequo) per il corso magistrale Bocconi 20878 Computer Vision & Image Processing. Pubblicato da Bocconi Students for Machine Learning."
    tech:
      - "Computer vision"
      - "Medical imaging"
    url: "https://github.com/davide-beltrame/medimg-saliency-benchmark"
    featured: true
    collaborative: true

