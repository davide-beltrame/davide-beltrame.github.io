# Research roles, newest first, then papers. The page renders both lists in the
# order written here — there is no sort in the template. The ICML 2026 spotlight
# comes first as the stronger result, ahead of the newer workshop poster;
# /everything/ sorts by `date` and still lists the poster first.
#
# `link` is the readable copy of the paper, labelled by `preprint_label` (the
# arXiv preprint by default). `venue_link` is the paper's page at the venue, and
# where it exists the title points there instead — they are different claims and
# the page should not blur them. `link` stays reachable in the row below the
# entry, so the PDF is one click away either way.
#
# The msc-thesis role carries a `thesis` block, the thesis itself as one row of
# /everything/: its title, the month it was discussed and where.
#
# `status` on a paper carries venue status and author-list footnotes verbatim.
# `badge` is the short status shown after the venue on the home page, where the
# author list (and so the footnote) is not shown.
# `summary` is the short plain description shown on the entry; `abstract`, where
# present, sits in a disclosure under it. The length-aware paper carries no
# abstract: the arXiv v1 abstract describes an earlier version of the method than
# the workshop paper.
#
# `poster`, where present, is a poster PDF the site publishes, with its label.
#
# `figure`, where present, is a figure from the paper or its poster, shown on
# the home page: `src` is the path without its `-<width>.webp` suffix, `widths`
# the encoded sizes. Figures are re-encoded with no metadata.
#
# The two course projects that used to sit here (graded exam projects, not
# publications) now live in `_data/projects.yml` instead.

interests:
  en: "I recently studied memorisation and generalisation in diffusion models, and how diffusion language models estimate the length of their answer before decoding it. I’m interested in measuring what learned representations retain or discard, and in world models and GFlowNets."
  it: "Di recente ho studiato la memorizzazione e la generalizzazione nei diffusion models e come i diffusion language models stimano la lunghezza della risposta prima di generarla. Mi interessa misurare cosa conservano o scartano le rappresentazioni apprese, e approfondire i world models e le GFlowNets."

