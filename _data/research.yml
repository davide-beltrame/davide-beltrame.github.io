# Research roles, newest first, then papers and preprints, newest first. The
# page renders both lists in the order written here — there is no sort in the
# template.
#
# `link` is the preprint. `venue_link` is the paper of record at the venue, and
# where it exists the title points there instead — they are different claims and
# the page should not blur them. The arXiv version stays reachable, labelled as
# the preprint, because it is what a reader without an OpenReview account gets.
#
# `status` on a paper carries venue status and author-list footnotes verbatim.
# `badge` is the short status shown after the venue on the home page, where the
# author list (and so the footnote) is not shown.
# `summary` is the short plain description shown on the entry; `abstract`, where
# present, sits in a disclosure under it. The length-aware paper carries no
# abstract: the arXiv abstract describes an earlier version of the method than
# the workshop paper.
#
# `figure`, where present, is the paper's own figure shown on the home page:
# `src` is the path without its `-<width>.webp` suffix, `widths` the encoded
# sizes. Figures are re-encoded with no metadata.
#
# The two course projects that used to sit here (graded exam projects, not
# publications) now live in `_data/projects.yml` instead.

interests:
  en: "I study memorisation and generalisation in diffusion models. I’m interested in measuring what learned representations retain or discard, and in world models and GFlowNets."
  it: "Studio memorizzazione e generalizzazione nei diffusion models. Mi interessa misurare cosa conservano o scartano le rappresentazioni apprese, e approfondire world models e GFlowNets."

