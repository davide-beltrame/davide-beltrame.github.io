papers:
  - id: biased-generalization
    title:
      en: "Biased Generalization in Diffusion Models"
      it: "Biased Generalization in Diffusion Models"
    authors: "Jérôme Garnier-Brun*, Luca Biggio*, Davide Beltrame, Marc Mézard, Luca Saglietti"
    year: "2026"
    date: "2026-03-03"
    venue: "ICML 2026"
    status:
      en: "Spotlight, top 2.2% of submissions. *Equal contribution."
      it: "Spotlight, tra il miglior 2,2% dei lavori presentati. *Contributo paritario."
    badge:
      en: "Spotlight, top 2.2%"
      it: "Spotlight, tra il miglior 2,2%"
    abstract:
      en: "Generalization in generative modeling is defined as the ability to learn an underlying distribution from a finite dataset and produce novel samples, with evaluation largely driven by held-out performance and perceived sample quality. In practice, training is often stopped at the minimum of the test loss, taken as an operational indicator of generalization. We challenge this viewpoint by identifying a phase of biased generalization during training, in which the model continues to decrease the test loss while favoring samples with anomalously high proximity to training data. By training the same network on two disjoint datasets and comparing the mutual distances of generated samples and their similarity to training data, we introduce a quantitative measure of bias and demonstrate its presence on real images. We then study the mechanism of bias, using a controlled hierarchical data model where access to exact scores and ground-truth statistics allows us to precisely characterize its onset. We attribute this phenomenon to the sequential nature of feature learning in deep networks, where coarse structure is learned early in a data-independent manner, while finer features are resolved later in a way that increasingly depends on individual training samples. Our results show that early stopping at the test loss minimum, while optimal under standard generalization criteria, may be insufficient for privacy-critical applications."
      it: "La generalizzazione nei modelli generativi è la capacità di apprendere una distribuzione a partire da un dataset finito e di generare nuovi campioni. La valutazione si basa soprattutto sulle prestazioni su dati held-out e sulla qualità percepita dei campioni generati. Nella pratica si ricorre spesso all’early stopping al minimo della test loss, usato come indicatore operativo della generalizzazione. Mettiamo in discussione questo criterio identificando una fase di biased generalization durante il training: la test loss continua a diminuire, mentre i campioni generati risultano insolitamente vicini ai dati di training. Addestrando la stessa rete su due dataset disgiunti e confrontando le distanze reciproche tra i campioni generati e la loro somiglianza con i dati di training, introduciamo una misura quantitativa del bias e ne dimostriamo la presenza su immagini reali. Studiamo poi il meccanismo del bias in un modello di dati gerarchico e controllato, in cui gli score esatti e le statistiche di ground truth permettono di caratterizzarne con precisione l’insorgenza. Attribuiamo il fenomeno alla natura sequenziale del feature learning nelle reti profonde: la struttura a grana grossa viene appresa inizialmente in modo indipendente dai dati, mentre le feature più fini vengono apprese in seguito e dipendono sempre più dai singoli campioni di training. I risultati mostrano che l’early stopping al minimo della test loss, pur essendo ottimale secondo i criteri standard di generalizzazione, può essere insufficiente nelle applicazioni in cui la tutela della privacy è critica."
    link: "https://arxiv.org/abs/2603.03469"
    # The arXiv version above is the pre-conference preprint; a v2 reflecting the
    # camera-ready is not posted yet.
    venue_link: "https://openreview.net/forum?id=IqTvyp40O6"
    code: "https://github.com/davide-beltrame/biased-generalization"
    figure:
      src: "/assets/img/research/biased-generalization-summary"
      widths: [800, 1600]
      ratio: "3.60"
      alt:
        en: "Figure 1 of the paper. (a) On CelebA, the distance between samples from models trained on disjoint splits reaches its minimum before the test loss does, with generated faces and their nearest training images. (b) The same effect on hierarchical data, as the network resolves finer features. (c) A training-free model across sharpness values."
        it: "Figura 1 dell’articolo. (a) Su CelebA, la distanza tra i campioni di modelli addestrati su insiemi disgiunti raggiunge il minimo prima della test loss, con i volti generati e le immagini di training più vicine. (b) Lo stesso effetto su dati gerarchici, mentre la rete risolve feature più fini. (c) Un modello senza addestramento al variare della nitidezza."
    summary:
      en: "A lower test loss can hide a growing bias towards training examples. We measure this effect on real images and study its onset in a controlled hierarchical model."
      it: "La test loss può diminuire mentre aumenta il bias verso i dati di training. Misuriamo questo effetto su immagini reali e ne studiamo l’insorgenza in un modello gerarchico controllato."

  - id: length-aware-diffusion
    title:
      en: "Diffusion Language Models Are Natively Length Aware"
      it: "Diffusion Language Models Are Natively Length Aware"
    authors: "Vittorio Rossi*, Giacomo Cirò*, Davide Beltrame*, Luca Gandolfi, Paul Röttger, Dirk Hovy"
    year: "2026"
    date: "2026-03-06"
    status:
      en: "Poster. Also presented as a finalist at EASR 2026 (30 October 2026). *Equal contribution."
      it: "Poster. Presentato anche come finalista a EASR 2026 (30 ottobre 2026). *Contributo paritario."
    badge:
      en: "Poster"
      it: "Poster"
    # `venue_link` is the OpenReview forum page, which the title opens; `link` is
    # the camera-ready PDF there. arXiv v1 (2603.06123) describes an earlier
    # version of the method and is not linked; when v2 is posted, `link` goes back
    # to arXiv with the default preprint label.
    venue_link: "https://openreview.net/forum?id=HdUzz1tsuY"
    link: "https://openreview.net/pdf?id=HdUzz1tsuY"
    preprint_label:
      en: "Paper (PDF)"
      it: "Articolo (PDF)"
    code: "https://github.com/VittorioRossi/smartcrop"
    # The workshop poster, also presented at Europe AI Summer Research 2026
    # (EASR) on 30 Oct 2026, where the paper was a finalist.
    poster:
      url: "/assets/files/length-aware-diffusion-poster.pdf"
      label:
        en: "Poster (PDF)"
        it: "Poster (PDF)"
    venue: "NeurIPS 2026 DiffuLM Workshop"
    figure:
      src: "/assets/img/research/smartcrop-schematic"
      widths: [800, 1600]
      ratio: "2.26"
      alt:
        en: "The SmartCrop schematic from the poster, with illustrative values. 1: one forward pass over a fully masked canvas reads p(EoS), the probability of end of sequence, at each position. 2: the canvas is cropped where p(EoS) first reaches q = 0.9. 3: the shorter canvas is denoised as usual, and the positions past the cut are dropped."
        it: "Lo schema di SmartCrop dal poster, con valori illustrativi. 1: un solo forward pass su un canvas di soli token [MASK] legge p(EoS), la probabilità di fine sequenza, in ogni posizione. 2: il canvas viene tagliato dove p(EoS) raggiunge per la prima volta q = 0,9. 3: il canvas ridotto viene sottoposto al denoising come di consueto, e le posizioni oltre il taglio vengono scartate."
    summary:
      en: "A diffusion language model’s first forward pass estimates the distribution of its answer length. SmartCrop reads that estimate once and crops the canvas where the estimated length CDF first reaches 0.9. On LLaDA-8B, with no training, it decodes 1.4–6× faster than a fixed 1024-token canvas at one token per step and loses at most 3.2 points of accuracy on four maths and code benchmarks; on DREAM-7B the loss reaches 7.3 points."
      it: "Il primo forward pass di un diffusion language model stima la distribuzione della lunghezza della risposta. SmartCrop legge questa stima una sola volta e taglia il canvas dove la CDF stimata della lunghezza raggiunge per la prima volta 0,9. Su LLaDA-8B, senza training e con un token per passo, la generazione è da 1,4 a 6 volte più veloce rispetto a un canvas fisso di 1024 token, con al massimo 3,2 punti di accuratezza in meno su quattro benchmark di matematica e codice; su DREAM-7B la perdita arriva a 7,3 punti."
