# Curated, not a complete log — only books he'd actually recommend go on this
# list. No rating field of any kind.
#
# Schema per entry:
#   title:    {en, it} — the title as published in each language
#   creator:  optional, the author (or director, for a film)
#   year:     optional, original publication year
#   finished: optional, the date he finished it, YYYY-MM-DD
#   note:     optional {en, it} — his one-line take; until there is one, the
#             page says a note is to follow
#   link:     optional URL; the English Wikipedia page for the work
#   tags:     optional list of short strings
#   illustration: optional public-domain or CC0 image for the entry, with
#             `src` (path without `-<width>.webp`), `widths`, `ratio`
#             (width/height), {en, it} `alt` and `credit`, and `source`, the
#             page it came from. The credit shows over the image on hover.
#             Re-encoded with no metadata before it is committed. The home
#             page's Reading preview uses the first entry's.
#
# Only books he has named go here, and nothing is filled in for him: no note,
# date or year he has not supplied.
items:
