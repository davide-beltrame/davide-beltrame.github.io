# Story timeline, grouped by year, newest year first, newest event first within
# a year. The page renders this order as written.
#
# `date` is the raw date as recorded, DD/MM/YYYY, MM/YYYY or YYYY. For a full
# date Story builds the day and month from it ("23 October", "23 ottobre"); a
# month or a range is written out in `display`; a year-only entry shows no date
# line. An event may also carry a `description` {en, it} pair.
#
# The home page's news list is the first three events here, with the date built
# from `date`, so the newest entries are what a visitor sees first.
# `link` may carry a page `ref` and stable `anchor`, or an external `url`.
# `kind: msc_exam` identifies MSc exams, which Story folds into one disclosure
# per year; `photo_trip` links a photo disclosure to a trip.

years:
