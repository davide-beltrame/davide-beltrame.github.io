# Story timeline, grouped by year, newest year first, newest event first within
# a year. The page renders this order as written.
#
# `date` is the raw date as recorded. `display` is what the page shows next to
# the event: a year-only entry shows no date line, so it carries no `display`.
# An event may also carry a `description` {en, it} pair; none does yet.

years:
  - year: "2026"
    events:
      - date: "02/2026"
        display:
          en: "February"
          it: "Febbraio"
        title:
          en: "I attend McKinsey's \"New Horizon: Lead What's Next in AI\" program in Barcelona."
          it: "Partecipo al programma \"New Horizon: Lead What's Next in AI\" di McKinsey a Barcellona."

  - year: "2025"
    events:
      - date: "09/2025"
        display:
          en: "September"
          it: "Settembre"
        title:
          en: "I begin my master's thesis on generalization in diffusion models at the Bocconi Machine Learning & Statistical Physics Lab, advised by Luca Biggio."
          it: "Inizio la tesi magistrale sulla generalizzazione nei modelli di diffusione presso il Bocconi Machine Learning & Statistical Physics Lab, relatore Luca Biggio."

      - date: "05/2025"
        display:
          en: "May"
          it: "Maggio"
        title:
          en: "I begin an AI engineering internship at CommerceClarity in Milan."
          it: "Inizio uno stage in ingegneria AI presso CommerceClarity a Milano."

      - date: "01/2025"
        display:
          en: "January"
          it: "Gennaio"
        title:
          en: "I become Editor-in-Chief delegate for AI and New Technologies at Consensus Rivista."
          it: "Divento Caporedattore delegato all'AI e alle Nuove Tecnologie per Consensus Rivista."

  - year: "2024"
    events:
      - date: "10/2024"
        display:
          en: "October"
          it: "Ottobre"
        title:
          en: "I start writing for Consensus Rivista."
          it: "Inizio a scrivere per Consensus Rivista."

      - date: "05/09/2024"
        display:
          en: "September 5th"
          it: "5 settembre"
        title:
          en: "I start my Master's Degree in Artificial Intelligence at Bocconi University in Milan."
          it: "Inizio il corso di laurea magistrale in Artificial Intelligence presso l’Università Bocconi di Milano."

      - date: "15/07/2024"
        display:
          en: "July 15th"
          it: "15 luglio"
        title:
          en: "I graduate with the highest honors (110 cum laude)."
          it: "Conseguo la laurea triennale con votazione finale di 110 e lode."

      - date: "07/2024"
        display:
          en: "July"
          it: "Luglio"
        title:
          en: "I move to Milan."
          it: "Mi trasferisco a Milano."

  - year: "2023"
    events:
      - date: "10/2023"
        display:
          en: "October"
          it: "Ottobre"
        title:
          en: "I'm promoted to auditor at JELU, LUISS's Junior Enterprise."
          it: "Vengo promosso ad auditor alla JELU, la Junior Enterprise della LUISS."

      - date: "09/2023"
        display:
          en: "September"
          it: "Settembre"
        title:
          en: "I become President of the Starting Finance Club Guido Carli."
          it: "Divento Presidente dello Starting Finance Club Guido Carli."

      - date: "06/2023"
        display:
          en: "June"
          it: "Giugno"
        title:
          en: "I take part in the Stats Under the Stars data-science hackathon at Marche Polytechnic University."
          it: "Partecipo all'hackathon di data science Stats Under the Stars all'Università Politecnica delle Marche."

      - date: "05/2023"
        display:
          en: "May"
          it: "Maggio"
        title:
          en: "I'm selected for Kozminski University's EU-funded AI and NLP for Business program in Warsaw."
          it: "Vengo selezionato per il programma di Kozminski University sull'AI e l'NLP per il business a Varsavia, finanziato dall'UE."

      - date: "03/2023"
        display:
          en: "March"
          it: "Marzo"
        title:
          en: "I begin as a trainee auditor at JELU."
          it: "Inizio come trainee auditor alla JELU."

  - year: "2021"
    events:
      - date: "11/2021"
        display:
          en: "November"
          it: "Novembre"
        title:
          en: "I take part in Confindustria Abruzzo's regional Innovation Hackathon."
          it: "Partecipo all'Innovation Hackathon regionale di Confindustria Abruzzo."

      - date: "13/09/2021"
        display:
          en: "September 13th"
          it: "13 settembre"
        title:
          en: "I start my Bachelor's Degree in Management and Computer Science at LUISS Guido Carli University"
          it: "Inizio il corso di laurea triennale in Management and Computer Science presso l’Università LUISS Guido Carli."

      - date: "07/2021"
        display:
          en: "July"
          it: "Luglio"
        title:
          en: "I'm awarded the CrackThePuzzle merit scholarship, a full tuition waiver for my Bachelor's."
          it: "Mi viene assegnata la borsa di studio al merito CrackThePuzzle, esenzione totale delle tasse per la triennale."

      - date: "25/06/2021"
        display:
          en: "June 25th"
          it: "25 giugno"
        title:
          en: "I graduate from Liceo Scientifico Statale \"Augusto Righi\" in Rome with a final grade of 100 cum laude."
          it: "Mi diplomo al liceo scientifico statale \"Augusto Righi\" di Roma con 100 e lode."

  - year: "2022"
    events:
      - date: "11/2022"
        display:
          en: "November"
          it: "Novembre"
        title:
          en: "I become Vice President of the Starting Finance Club Guido Carli."
          it: "Divento Vicepresidente dello Starting Finance Club Guido Carli."

      - date: "11/2022"
        display:
          en: "November"
          it: "Novembre"
        title:
          en: "I score 8.5 on the IELTS Academic English exam."
          it: "Ottengo un punteggio di 8.5 all'esame IELTS Academic di inglese."

      - date: "06/2022"
        display:
          en: "June"
          it: "Giugno"
        title:
          en: "I become Head of HR and IT at the Starting Finance Club Guido Carli."
          it: "Divento Head of HR and IT dello Starting Finance Club Guido Carli."

      - date: "03/2022"
        display:
          en: "March"
          it: "Marzo"
        title:
          en: "I begin tutoring competitive-programming training for the Italian Informatics Olympics (OII) at LUISS."
          it: "Inizio a fare da tutor per la preparazione alle Olimpiadi Italiane di Informatica (OII) presso la LUISS."

  - year: "2020"
    events:
      - date: "09/2020"
        display:
          en: "September"
          it: "Settembre"
        title:
          en: "I pass the Cambridge C1 Advanced English exam."
          it: "Supero l'esame di inglese Cambridge C1 Advanced."

      - date: "07/2020"
        display:
          en: "July"
          it: "Luglio"
        title:
          en: "I attend the university orientation courses of Scuola Normale Superiore and the joint SNS-SSSA-IUSS program in Pisa."
          it: "Partecipo ai corsi di orientamento universitario della Scuola Normale Superiore e al programma congiunto SNS-SSSA-IUSS a Pisa."

      - date: "2020"
        title:
          en: "My artwork \"Chromatic Dualism\" is exhibited in Rome as part of the Art & Science Across Italy competition, and wins a visit to the INFN Nuclear Physics Laboratories in Frascati."
          it: "La mia opera \"Dualismo cromatico\" viene esposta a Roma nell'ambito del concorso Art & Science Across Italy, e vince una visita ai Laboratori Nazionali di Fisica Nucleare dell'INFN di Frascati."

  - year: "2019"
    events:
      - date: "04/2019"
        display:
          en: "April"
          it: "Aprile"
        title:
          en: "I attend Haarlem Model United Nations as an Economic and Social Council delegate."
          it: "Partecipo all'Haarlem Model United Nations come delegato dell'Economic and Social Council."

  - year: "2016"
    events:
      - date: "12/09/2016"
        display:
          en: "September 12th"
          it: "12 settembre"
        title:
          en: "My first day at Liceo Scientifico Statale \"Augusto Righi\" in Rome."
          it: "Il mio primo giorno al Liceo Scientifico Statale \"Augusto Righi\" a Roma."

      - date: "01/09/2016"
        display:
          en: "September 1st"
          it: "1 settembre"
        title:
          en: "My family and I move to Rome."
          it: "La mia famiglia e io ci trasferiamo a Roma."

  - year: "2007"
    events:
      - date: "2007"
        title:
          en: "My family and I move to Latina."
          it: "La mia famiglia e io ci trasferiamo a Latina."

  - year: "2002"
    events:
      - date: "23/07/2002"
        display:
          en: "July 23rd"
          it: "23 luglio"
        title:
          en: "Born in Imperia, Italy, on the western Ligurian Riviera."
          it: "Nasco a Imperia, nella Riviera ligure di Ponente."

