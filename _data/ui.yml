  trips:
    en: "Trips"
    it: "Viaggi"
  everything:
    en: "Everything"
    it: "Tutto"
  video_games:
    en: "Video games"
    it: "Videogiochi"

# Labels for the contact links. The email one shows this label and never the
# address, which appears only inside an entity-encoded mailto: href.
contact_links:
  email:
    en: "Email"
    it: "Email"
  github:
    en: "GitHub"
    it: "GitHub"
  linkedin:
    en: "LinkedIn"
    it: "LinkedIn"
  scholar:
    en: "Scholar"
    it: "Scholar"
  cv:
    en: "CV"
    it: "CV"

labels:
  # Story folds each year's MSc exams into one disclosure, summarised as the
  # count followed by one of these: "5 MSc exams, …". `msc_exam` is for a year
  # with a single exam.
  msc_exam:
    en: "MSc exam, Artificial Intelligence (Computer Science), Bocconi"
    it: "esame della magistrale, Artificial Intelligence (Informatica), Bocconi"
  msc_exams:
    en: "MSc exams, Artificial Intelligence (Computer Science), Bocconi"
    it: "esami della magistrale, Artificial Intelligence (Informatica), Bocconi"
  collaborative:
    en: "Collaborative"
    it: "In collaborazione"
  code:
    en: "Code"
    it: "Codice"
  trip_photos:
    en: "Trip photos"
    it: "Foto del viaggio"
  preprint:
    en: "arXiv preprint"
    it: "Preprint su arXiv"
  abstract:
    en: "Abstract"
    it: "Abstract"
  all_research:
    en: "All research"
    it: "Tutta la ricerca"
  # Thousands separator for rendered numbers. Italian uses a period, so an
  # English comma on an Italian page would read as a decimal point.
  thousands_separator:
    en: ","
    it: "."
  # Decimal separator for averages: "3.9" in English, "3,9" in Italian.
  decimal_separator:
    en: "."
    it: ","
  news:
    en: "Recent news"
    it: "Novità"
  # Precedes `now.display` under the home page's contact links.
  updated:
    en: "Updated"
    it: "Aggiornato a"
  full_story:
    en: "Full story"
    it: "Tutta la storia"
  # Short month names for dates built from a raw `date` field, such as the
  # news list on the home page.
  months:
    en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
    it: ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"]
  # Full month names, for Story's day-month dates ("23 October", "23 ottobre").
  months_long:
    en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
    it: ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"]

