    en: "GitHub"
    it: "GitHub"
  linkedin:
    en: "LinkedIn"
    it: "LinkedIn"
  scholar:
    en: "Scholar"
    it: "Scholar"
  cv:
    en: "CV"
    it: "CV"

labels:
  collaborative:
