# Structural and navigational text: nav labels, page metadata, section
# headings, control labels. Every value is an {en, it} pair resolved by
# _includes/t.html.
#
# `nav` is an ordered list of page refs. The URL for each comes from the page
# with that `ref` in the current language, so permalinks live in the page front
# matter and nowhere else.

#
# The bar lists every entry except `home`: his name at the left of the bar is
# the link home on every page but the home page itself, where the name is the
# heading instead. The order here is the order in the bar, on every page.
# `home` stays here because the redirect stubs read its label. Everything is
# reached from the footer.

nav:
  - ref: home
    label:
      en: "Home"
      it: "Home"
  - ref: research
    label:
      en: "Research"
      it: "Ricerca"
  - ref: projects
    label:
      en: "Projects"
      it: "Progetti"
  - ref: story
    label:
      en: "Story"
      it: "Storia"
  - ref: shelf
    label:
      en: "Shelf"
      it: "Scaffale"
  - ref: trips
    label:
      en: "Trips"
      it: "Viaggi"

# Per-page <title> and meta description, keyed by page ref.
pages:
  home:
    title:
      en: "Davide Beltrame"
      it: "Davide Beltrame"
    description:
      en: "Davide Beltrame’s personal website."
      it: "Il sito personale di Davide Beltrame."
  research:
    title:
      en: "Research · Davide Beltrame"
      it: "Ricerca · Davide Beltrame"
    description:
      en: "Papers and preprints by Davide Beltrame on diffusion models, NLP, and computer vision."
      it: "Articoli e preprint di Davide Beltrame su modelli di diffusione, NLP e computer vision."
  projects:
    title:
      en: "Projects · Davide Beltrame"
      it: "Progetti · Davide Beltrame"
    description:
      en: "Research projects and software by Davide Beltrame in AI, NLP, and computer vision."
      it: "Progetti di ricerca e software di Davide Beltrame in IA, NLP e computer vision."
  story:
    title:
      en: "Story · Davide Beltrame"
      it: "Storia · Davide Beltrame"
    # This read as a copy of the home page's description until 2026-08-13, which
    # gave two pages the same snippet in a search result.
    description:
      en: "A dated timeline of Davide Beltrame’s studies, research, and work."
      it: "Una cronologia datata degli studi, della ricerca e del lavoro di Davide Beltrame."
  shelf:
    title:
      en: "Shelf · Davide Beltrame"
      it: "Scaffale · Davide Beltrame"
    description:
      en: "Books, films, video games, and languages."
      it: "Libri, film, videogiochi e lingue."
  trips:
    title:
      en: "Trips · Davide Beltrame"
      it: "Viaggi · Davide Beltrame"
    description:
      en: "Pescasseroli in September 2026, and London for Hadestown and Jesus Christ Superstar."
      it: "Pescasseroli a settembre 2026, e Londra per Hadestown e Jesus Christ Superstar."
  everything:
    title:
      en: "Everything · Davide Beltrame"
      it: "Tutto · Davide Beltrame"
    description:
      en: "Papers and projects by Davide Beltrame."
      it: "Articoli e progetti di Davide Beltrame."
  notfound:
    title:
      en: "Page not found · Davide Beltrame"
      it: "Pagina non trovata · Davide Beltrame"
    description:
      en: "That page is not on this site."
      it: "Questa pagina non esiste su questo sito."

# Open Graph and Twitter card values. `image` is a generated 1200x630 card per
# language, built from this data so the preview cannot contradict the page.
og:
  locale:
    en: "en_US"
    it: "it_IT"
  image:
    en: "/assets/img/og-card.jpg"
    it: "/assets/img/og-card-it.jpg"
  image_alt:
    en: "Davide Beltrame, student and researcher in deep learning and AI"
    it: "Davide Beltrame, studente e ricercatore in IA e deep learning"

# Section headings. The keys that end a route's <h1> and the keys that head a
# band inside it are separate: /research/ is titled "Research" and contains a
# "Publications" band, and /shelf/ is titled "Shelf" and contains a
# "Books & Films" one.
sections:
  research:
    en: "Research"
    it: "Ricerca"
  roles:
    en: "Roles"
    it: "Ruoli"
  publications:
    en: "Publications"
    it: "Pubblicazioni"
  projects:
    en: "Projects"
    it: "Progetti"
  story:
    en: "Story"
    it: "Storia"
  shelf:
    en: "Shelf"
    it: "Scaffale"
  books_films:
    en: "Books & Films"
    it: "Libri e film"
  duolingo:
    en: "Duolingo"
    it: "Duolingo"
  nyt_games:
    en: "NYT Games"
    it: "Giochi NYT"
  trips:
    en: "Trips"
    it: "Viaggi"
  everything:
    en: "Everything"
    it: "Tutto"
  video_games:
    en: "Video games"
    it: "Videogiochi"

