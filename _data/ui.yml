# Static hosting serves one 404 for the whole domain, so this page is in English
# and offers the Italian home as a link rather than guessing the reader's language.
not_found:
  heading:
    en: "Page not found"
    it: "Pagina non trovata"
  message:
    en: "The link may be out of date, or the page may have moved. Everything on this site is reachable from the home page."
    it: "Il link potrebbe essere vecchio, oppure la pagina è stata spostata. Tutto il sito è raggiungibile dalla home."
  home_link:
    en: "Go to the home page"
    it: "Vai alla home"
  other_language:
    en: "Italiano"
    it: "English"

redirect:
  moved:
    en: "This page has moved."
    it: "Questa pagina è stata spostata."

# The exploration map in the footer. `sections` is the set it counts, in the
# order the map lists them, and must match SECTIONS in assets/js/exploration.js.
# English and Italian pages share these refs, so a visit in either language
# counts once. Progress is kept in the visitor's own browser and never sent
# anywhere. The progress line reads "<visited> of <total> explored".
exploration:
  sections:
    - research
    - projects
    - story
    - shelf
    - trips
  title:
    en: "Explore the site"
    it: "Esplora il sito"
  close:
    en: "Close"
    it: "Chiudi"
  of:
    en: "of"
    it: "di"
  explored:
    en: "explored"
    it: "sezioni esplorate"
  suggest:
    en: "Take me somewhere new"
    it: "Portami dove non sono stato"
  reset:
    en: "Reset visits"
    it: "Azzera le visite"
  complete:
    en: "You’ve visited every section. The map is still here whenever you need it."
    it: "Hai visitato tutte le sezioni. La mappa resta qui quando ti serve."
  reset_notice:
    en: "Visits reset. Your next section visit starts a new count."
    it: "Visite azzerate. La prossima sezione visitata avvia un nuovo conteggio."
  visited:
    en: "Visited"
    it: "Visitata"
  storage_note:
    en: "Saved only in this browser. English and Italian count as the same section."
    it: "Salvato solo in questo browser. Inglese e italiano contano come la stessa sezione."
  progress_label:
    en: "Sections visited"
    it: "Sezioni visitate"
  footer_nav:
    en: "More pages"
    it: "Altre pagine"
