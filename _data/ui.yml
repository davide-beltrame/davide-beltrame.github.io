# Static hosting serves one 404 for the whole domain, including every missing
# /it/ URL, so the page shows both values of each pair, English then Italian,
# rather than guessing the reader's language. `home_link.it` is the link to the
# Italian home.
not_found:
  heading:
    en: "Page not found"
    it: "Pagina non trovata"
  message:
    en: "The link may be out of date, or the page may have moved. Everything on this site is reachable from the home page."
    it: "Il link potrebbe essere obsoleto, oppure la pagina potrebbe essere stata spostata. Tutto il sito è raggiungibile dalla home."
  home_link:
    en: "Home"
    it: "Home in italiano"

redirect:
  moved:
    en: "This page has moved."
    it: "Questa pagina è stata spostata."

# The exploration map in the footer. `sections` is the set it lists, in this
# order, and must match SECTIONS in assets/js/exploration.js. English and
# Italian pages share these refs. Visits are kept in the visitor's own browser,
# never sent anywhere and never shown; they only choose where "somewhere new"
# goes.
exploration:
  sections:
    - research
    - projects
    - story
    - shelf
    - trips
  title:
    en: "Explore the site"
    it: "Esplora il sito"
  close:
    en: "Close"
    it: "Chiudi"
  suggest:
    en: "Take me somewhere new"
    it: "Portami in una sezione nuova"
  storage_note:
    en: "Visits are remembered only in this browser, to pick a section you have not opened yet."
    it: "Le visite restano solo in questo browser e servono a scegliere una sezione che non hai ancora aperto."
  footer_nav:
    en: "More pages"
    it: "Altre pagine"

# The licence line at the foot of every page, after "© <year> <name>.". It
# carries its own link, so it is rendered raw.
footer:
  licence:
    en: "Text under <a rel=\"license\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a>; photos all rights reserved; code under the MIT License. Illustrations are public domain; paper figures belong to their authors."
    it: "Testi con licenza <a rel=\"license\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a>; foto: tutti i diritti riservati; codice con licenza MIT. Le illustrazioni sono di pubblico dominio; le figure degli articoli appartengono ai rispettivi autori."
