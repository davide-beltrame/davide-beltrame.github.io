<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davide Beltrame</title>
    <meta name="description" content="Davide Beltrame's personal website.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/files/favicon/davide_beltrame_apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/files/favicon/davide_beltrame_favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/files/favicon/davide_beltrame_favicon-16x16.png">
    <link rel="shortcut icon" href="../assets/files/favicon/davide_beltrame_favicon.ico">
    <meta name="theme-color" content="#fafafa">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="navbar-brand">
                <a href="/home">davide beltrame</a>
            </div>
            <div class="nav-links">
                <a href="/home" class="nav-item active" data-section="home">home</a>
                <a href="/projects" class="nav-item" data-section="projects">projects</a>
                <a href="/story" class="nav-item" data-section="story">story</a>
                <a href="/other" class="nav-item" data-section="other">other</a>
                <div class="nav-controls">
                    <button class="lang-toggle" id="langToggle" aria-label="Switch language">
                        <span class="lang-text">EN</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <span class="toggle-circle"></span>
                    </button>
                </div>
            </div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
                <span class="hamburger-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="/home" class="nav-item active" data-section="home">home</a>
        <a href="/projects" class="nav-item" data-section="projects">projects</a>
        <a href="/story" class="nav-item" data-section="story">story</a>
        <a href="/other" class="nav-item" data-section="other">other</a>
        <div class="nav-controls">
            <button class="lang-toggle" id="langToggleMobile" aria-label="Switch language">
                <span class="lang-text">EN</span>
            </button>
            <button class="theme-toggle" id="themeToggleMobile" aria-label="Toggle theme">
                <span class="toggle-circle"></span>
            </button>
        </div>
    </div>

    <div class="container">
        <main class="main">
            <section class="section active" id="home">
                <!-- Hero Section (Option A: Side-by-Side) -->
                <div class="hero">
                    <div class="hero-image">
                        <img src="../assets/files/davide_beltrame_propic.jpg" alt="Davide Beltrame">
                    </div>
                    <div class="hero-content">
                        <h1 class="hero-name" id="heroName">Hi, I'm Davide!</h1>
                        <p class="hero-title" id="heroTitle"></p>
                        <div class="hero-bio" id="heroBio"></div>
                    </div>
                </div>

                <!-- Contact links (centered) -->
                <div class="contact-section">
                    <div class="contact-links">
                        <a href="#" class="contact-link" id="contactEmail" title="Email">
                            <i class="fas fa-envelope contact-icon"></i>
                            <span>Email</span>
                        </a>
                        <a href="#" target="_blank" rel="noopener noreferrer" class="contact-link" id="contactGithub"
                            title="GitHub">
                            <i class="fab fa-github contact-icon"></i>
                            <span>GitHub</span>
                        </a>
                        <a href="#" target="_blank" rel="noopener noreferrer" class="contact-link" id="contactLinkedin"
                            title="LinkedIn">
                            <i class="fab fa-linkedin contact-icon"></i>
                            <span>LinkedIn</span>
                        </a>
                        <a href="#" target="_blank" rel="noopener noreferrer" class="contact-link" id="contactCV"
                            title="CV">
                            <i class="fas fa-file-pdf contact-icon"></i>
                            <span>CV</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>



    <footer class="site-footer">
        <div class="footer-inner">
            <span>© 2026 Davide Beltrame · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank"
                    rel="noopener noreferrer">CC BY-SA 4.0</a></span>
        </div>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>

</html>
