<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davide Beltrame</title>
    <meta name="description" content="Personal website of Davide Beltrame, showcasing projects, story, and other information.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/files/favicon/davide_beltrame_apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/files/favicon/davide_beltrame_favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/files/favicon/davide_beltrame_favicon-16x16.png">
    <link rel="shortcut icon" href="../assets/files/favicon/davide_beltrame_favicon.ico">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <img src="../assets/files/davide_beltrame_propic.jpg" alt="Davide Beltrame" class="profile-image-header">
                <h1 class="name">davide beltrame</h1>
            </div>
            <nav class="nav">
                <a href="/home" class="nav-item active" data-section="home">Home</a>
                <a href="/projects" class="nav-item" data-section="projects">Projects</a>
                <a href="/story" class="nav-item" data-section="story">Story</a>
                <a href="/other" class="nav-item" data-section="other">Other</a>
                <!-- Language switcher -->
                <button class="lang-toggle" id="langToggle" aria-label="Switch language">
                    <span class="lang-text">EN</span>
                </button>
                <!-- Theme toggle -->
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="toggle-circle"></span>
                </button>
            </nav>
        </header>

        <!-- Content Sections -->
        <main class="main">
            <!-- Home Section -->
            <section class="section active" id="home">
                <div class="warning" id="developmentNotice">
                </div>

                <div class="intro">
                    <p class="title">AI Student & Researcher</p>
                    <p class="subtitle"></p>
                </div>

                <div class="about">
                    <p></p>
                </div>

                <div class="contact">
                    <h3 class="contact-header">Get in Touch</h3>
                    <div class="contact-links">
                        <a href="#" class="contact-link" title="Email">
                            <i class="fas fa-envelope contact-icon"></i>
                            <span class="contact-text">Email</span>
                        </a>
                        <a href="#" target="_blank" class="contact-link" title="GitHub">
                            <i class="fab fa-github contact-icon"></i>
                            <span class="contact-text">GitHub</span>
                        </a>
                        <a href="#" target="_blank" class="contact-link" title="LinkedIn">
                            <i class="fab fa-linkedin contact-icon"></i>
                            <span class="contact-text">LinkedIn</span>
                        </a>
                        <a href="#" target="_blank" class="contact-link" title="CV">
                            <i class="fas fa-file-pdf contact-icon"></i>
                            <span class="contact-text">CV</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
